name: autoupdate

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose: GitHub cron queues are heavily
    # oversubscribed at :00, so a minute past it starts faster and reliably.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    name: Update browser and policy pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install pyyaml

      - name: Regenerate debloat policy from upstream manifest
        run: python scripts/gen-debloat-policy.py --browser brave -o modules/brave.json

      - name: Update flake inputs
        run: nix flake update --show-trace

      - name: Verify the flake evaluates
        run: nix flake check --no-build --no-write-lock-file --show-trace

      - name: Verify the packages build
        run: |
          nix build .#packages.x86_64-linux.default \
            .#packages.x86_64-linux.timid-brave-ephemeral \
            .#packages.x86_64-linux.timid-helium \
            .#packages.x86_64-linux.timid-brave-origin-captive \
            --no-link --no-write-lock-file

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes - upstream pins already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock modules/brave.json
          git commit -m "autoupdate: refresh flake inputs and debloat policy"

          # Every gate above (flake check, builds, fmt) already passed, so land
          # the refresh directly on main.
          git push origin HEAD:main
